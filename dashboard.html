<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Second Skin — Cross-Listing Dashboard</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --panel: #161616;
      --text: #e8e8e8;
      --muted: #888;
      --accent: #ff3b3b;
      --accent-soft: #ff6b6b;
      --ok: #3ddc84;
      --warn: #f4c542;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 2rem;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 1rem;
    }

    h1 { margin: 0; font-size: 1.8rem; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    .subtitle { color: var(--muted); font-size: 0.9rem; }

    .actions { margin-bottom: 1.5rem; }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid #333;
      padding: 0.55rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { border-color: var(--accent-soft); }
    .primary { background: var(--accent); border-color: var(--accent); color: #fff; }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }

    .inventory-card {
      background: var(--panel);
      border: 1px solid #222;
      border-radius: 8px;
      padding: 1rem;
    }

    .item-details h3 { margin: 0 0 0.5rem; font-size: 1.05rem; }
    .item-details p { margin: 0; color: var(--muted); font-size: 0.9rem; line-height: 1.4; }
    .item-meta { margin-top: 0.75rem; font-size: 0.8rem; color: var(--muted); }

    .control-panel {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .automation-trigger {
      flex: 1;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .automation-trigger.depop-theme { border-color: #ff2300; }
    .automation-trigger.grailed-theme { border-color: #fff; }
    .status-ready { color: var(--warn); }
    .status-active { color: var(--ok); }
    .status-sold { color: var(--muted); text-decoration: line-through; }
    .status-error { color: var(--accent); }

    .image-section { margin-top: 1rem; }
    .thumbnails {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.6rem;
    }
    .thumbnails img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #333;
    }
    .image-input { display: none; }
    .upload-photos, .generate-listing, .save-item {
      font-size: 0.8rem;
    }
    .generate-listing { border-color: var(--ok); }
    .save-item { border-color: var(--warn); margin-top: 0.5rem; }
    .gen-status {
      margin-left: 0.5rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .edit-section {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .edit-section input,
    .edit-section textarea {
      background: #0d0d0d;
      color: var(--text);
      border: 1px solid #333;
      border-radius: 4px;
      padding: 0.5rem;
      font-family: inherit;
      font-size: 0.85rem;
    }
    .edit-section textarea {
      min-height: 5rem;
      resize: vertical;
    }
    .edit-section input:disabled,
    .edit-section textarea:disabled {
      opacity: 0.6;
    }

    .control-panel {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .automation-trigger:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: #444;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Second <span>Skin</span></h1>
      <div class="subtitle">Local-first cross-listing for Depop & Grailed</div>
    </div>
    <div>
      <button id="reset-data" class="primary">Reset Seed Inventory</button>
    </div>
  </header>

  <div class="actions">
    <button id="add-item">+ Add Item</button>
  </div>

  <div id="inventory-container" class="inventory-grid"></div>

  <script src="ollama.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
